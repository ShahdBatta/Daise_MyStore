<div class="confirmation-container">
  <div class="confirmation-content">
    <div class="success-icon">✓</div>
    <h2>Order Confirmed!</h2>
    <p class="order-number">Order #{{ orderNumber }}</p>
    
    <div class="confirmation-message">
      <p>Thank you for your purchase!</p>
      <p>A confirmation email has been sent to your inbox with order details and tracking information.</p>
    </div>

    <div class="confirmation-next-steps">
      <h3>What happens next?</h3>
      <ol>
        <li>
          <span class="step-number">1</span>
          <span class="step-text">Order Processing</span>
        </li>
        <li>
          <span class="step-number">2</span>
          <span class="step-text">Carefully Arranged</span>
        </li>
        <li>
          <span class="step-number">3</span>
          <span class="step-text">Delivered Fresh</span>
        </li>
      </ol>
    </div>

    <button class="btn btn-primary" (click)="continueShopping()">
      Continue Shopping
    </button>
  </div>
</div>
